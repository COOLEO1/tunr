name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --org com.leon --project-name tunr .
      - run: python3 tool/patch_android.py
      - run: pip install pillow && python3 tool/make_icon.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Patch on_audio_query plugin
        run: python3 tool/patch_plugin.py
      - run: echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: tunr-apk, path: build/app/outputs/flutter-apk/app-release.apk }
